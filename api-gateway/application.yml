spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
    eureka:
      client:
        serviceUrl:
          defaultZone: http://eureka-server:8761/eureka  # Assuming your Eureka server is named 'eureka-server' in Docker Compose
        registerWithEureka: false
        fetchRegistry: false

server:
  port: 8080