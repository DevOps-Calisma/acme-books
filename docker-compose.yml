services:
  eureka-server:
    image: ygqygq2/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - acme
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://10.251.22.28:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  order-service:
    build: ./order-service
    env_file:
      - ./order-service/.env
    ports:
      - "${PORT:-5004}:${PORT:-5004}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - acme

  inventory-service:
    build: ./inventory-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - acme

  user-service:
    build: ./user-service
    ports:
      - "5008:5003"
    environment:
      - USER_PORT=5003
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acme

  user-service2:
    build: ./user-service
    ports:
      - "5003:5003"
    environment:
      - USER_PORT=5003
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acme2

  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    ports:
      - "${PAYMENT_PORT:-5005}:${PAYMENT_PORT:-5005}"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - acme

networks:
  acme:
    driver: bridge
  acme2:
    driver: bridge