services:
  eureka-server:
    image: ygqygq2/eureka-server:latest
    ports:
      - "8761:8761"
    networks:
      - acme
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://10.251.22.28:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build: ./order-service
    env_file:
      - ./order-service/.env
    ports:
      - "${PORT:-5004}:${PORT:-5004}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - acme

  inventory-service:
    build: ./inventory-service
    env_file:
      - ./inventory-service/.env
    ports:
      - "${INVENTORY_PORT:-5002}:${INVENTORY_PORT:-5002}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - acme

  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    ports:
      - "${USER_PORT:-5003}:${USER_PORT:-5003}"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - acme

networks:
  acme:
    external: true
